<body>

    <nav class="guide-crumbs" aria-label="現在の場所"><a href="../">推しルナ占い</a> <span aria-hidden="true">›</span> ルナのこころ整理</nav>

      <p class="h-intro-lead" id="h-intro-lead"></p>

      <!-- 操作エリア：保存した内容があるとき（3.2）・読み込めないとき（3.3）は、その案内とボタンをここに出す -->
      <div class="notice h-resume" id="h-resume" hidden>
        <p id="h-resume-text"></p>
        <button type="button" class="btn btn-primary" id="h-resume-main"></button>
        <button type="button" class="btn btn-ghost" id="h-resume-sub"></button>
      </div>
      <button type="button" class="btn btn-primary h-start" id="h-start">7つの質問をはじめる</button>
      <p class="h-intro-free" id="h-intro-free"></p>
      <p class="h-intro-privacy" id="h-intro-privacy"></p>

      <details class="h-details" id="h-details">
        <summary class="h-details-summary" id="h-details-summary"></summary>
        <div class="h-intro-card" id="h-intro-text"></div>
      </details>
      <button type="button" class="btn-text" id="h-intro-delete" hidden>保存した内容を消す</button>
    </section>

    <!-- 質問（1画面1問） -->
    <section class="h-screen" id="h-question" aria-labelledby="h-q-text" hidden>
      <p class="q-count" id="h-q-count"></p>
      <div class="progress" aria-hidden="true"><span class="progress-bar" id="h-progress"></span></div>
      <h2 class="q-text h-q-text" id="h-q-text" tabindex="-1"></h2>
      <p class="q-note" id="h-q-note" hidden></p>
      <p class="h-q-pick" id="h-q-pick" hidden></p>
      <div class="options h-options" id="h-options" role="group" aria-labelledby="h-q-text"></div>

      <!-- Q7：心の疲れ具合（1〜10・任意） -->
      <div class="h-q7" id="h-q7" hidden>
        <div class="h-face-wrap" aria-hidden="true">
          <img class="h-face" id="h-face" width="400" height="400" alt="" hidden>
          <span class="h-face-moon" id="h-face-moon">🌙</span>
        </div>
        <p class="h-q7-value" id="h-q7-value" aria-live="polite"></p>
        <div class="h-slider-row">
          <button type="button" class="h-step" id="h-q7-minus" aria-label="1つ小さくする">−</button>
          <input type="range" class="h-slider" id="h-q7-range" min="1" max="10" step="1" value="5" aria-describedby="h-q7-scale h-q7-note">
          <button type="button" class="h-step" id="h-q7-plus" aria-label="1つ大きくする">＋</button>
        </div>
        <div class="h-scale" id="h-q7-scale"><span id="h-q7-low"></span><span id="h-q7-high"></span></div>
        <p class="q-note h-q7-note" id="h-q7-note"></p>
      </div>

      <button type="button" class="btn btn-primary" id="h-next" disabled>次へ</button>
      <button type="button" class="btn btn-ghost" id="h-q7-skip" hidden></button>
      <button type="button" class="btn-back" id="h-back">‹ 戻る</button>
    </section>

    <!-- 結果 -->
    <section class="h-screen" id="h-result" aria-labelledby="h-result-title" hidden>
      <div class="hero guide-hero">
        <h2 class="guide-title" id="h-result-title" tabindex="-1">ルナのこころ整理</h2>
        <p class="result-date h-date" id="h-date"></p>

      <p class="notice h-result-notice" id="h-result-notice"></p>
      <article class="card card-blue h-section" aria-labelledby="h-sec-concern"><h2 class="card-title" id="h-sec-concern"></h2><div id="h-concern"></div></article>
      <article class="card card-pink h-section" aria-labelledby="h-sec-values"><h2 class="card-title" id="h-sec-values"></h2><div id="h-values"></div></article>
      <article class="card card-lavender h-section" aria-labelledby="h-sec-message"><h2 class="card-title" id="h-sec-message"></h2><div class="h-text" id="h-message"></div></article>
      <article class="card card-cream h-section" aria-labelledby="h-sec-action"><h2 class="card-title" id="h-sec-action"></h2><div class="h-text" id="h-action"></div></article>

      <button type="button" class="btn btn-primary h-copy" id="h-copy">整理結果をコピーする</button>
      <div class="h-copy-area" id="h-copy-area-main"></div>
      <button type="button" class="btn btn-ghost" id="h-again">もう一度整理する</button>

      <!-- 個別鑑定 Coming Soon（申込み・料金・受付日は載せない） -->
